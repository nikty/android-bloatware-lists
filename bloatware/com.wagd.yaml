- description: |-
    This malware is capable of sending malicious messages via WhatsApp, opening new tabs in the default web browser to game websites, downloading more malicious apps, and possibly other malicious behaviors.
    The malicious WhatsApp messages are most likely in order to further spread the infection to other mobile devices.
