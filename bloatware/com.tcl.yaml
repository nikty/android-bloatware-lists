- description: |-
    TGuard. Runs in the background on boot.
    Has these services:"Online Support" (related to `com.tcl.usercare`?),"IO Limit","Health" (device health?) stuff, battery and low-storage diagnostics. On model T509A, it links to `libTclRootCheck.so` (native shared dynamic library), very sus.
  id: com.tcl.guard
  removal: risky

- description: |-
