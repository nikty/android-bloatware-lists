- description: |-
    Stock reader app on Inkbook e-readers. Uninstall only if planning to use a different reader.
  id: com.inkbook.awesomereader
  removal: caution

- description: |-
    Stock reader app on Inkbook e-readers. Uninstall only if planning to use a different reader.
  id: com.inkbook.exoereader
  removal: caution

- description: |-
    Default library app on Inkbook e-readers. Will break the UI if uninstalled so only do so if you plan to replace the default UI app with e.g. SimpleLauncher or somehting of the sort.
  id: com.inkbook.os.library
  removal: risky

- description: |-
    App repository for Inkbook e-readers: Kindle, Kobo etc. Safe to uninstall if not using them. Also installs and updates EinkBro and a stats tracking app.
  id: com.inkbook.os.plus
  removal: caution

- description: |-
    Wrapper for Android settings which hides most irrelevant settings for e-ink devices e.g enabling animations.
  id: com.inkbook.os.settings
  removal: risky

