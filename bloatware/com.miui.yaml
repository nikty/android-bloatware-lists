- description: |-
    MIUI's COTA (Configuration Over-The-Air) service. Pretty much the same as com.google.configupdater but for miui services.
    Unlike google's config updater, it constantly connects to the web and sends/receives data from an unknown source. Might cause obscure issues with telephony and Xiaomi services.
    Safe to delete if you've deleted all Xiaomi services like Xiaomi Cloud, GetApps, xmsf, etc... and !!! have logged out of your Xiaomi Account !!! Pretty much all is same as with com.google.configupdater. Deleting it on HyperOS 2.0 causes no issues.
  id: com.miui.cotaservice
  removal: caution

- description: |-
    The LPA app that is constantly running in background, consuming RAM and battery. This app is the core of all the eSIM services on Xiaomi devices, runs and drains resources even if you have no eSIM.
    Constantly being found in running processes list. No issues appeared after removing it on HyperOS 2.0 and using it for over a month.
    Telephony and all settings stayed intact, worth deleting this if you don't use an eSIM.
  id: com.miui.euicc
  removal: caution

- description: |-
    Telemetry and diagnostics collector app that sends analytics to Xiaomi servers and has almost no use for user.
    Something on the level of com.miui.msa or com.miui.daemon. Worth deleting.
    Constantly connects somewhere and sends/receives up to 100KB of data per day to/from an unknown source. This also means it often runs in background.
    It's labeled as Blur and has orange-white MI icon, but it just hides under it. No blur/ui/any other issues seen after around a month of use of HyperOS 2.0 with this removed.
  id: com.miui.misightservice
  removal: safe

