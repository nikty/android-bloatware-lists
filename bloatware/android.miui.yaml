---
- description: |-
    Config to default icons/placeholder widgets in MIUI launcher.
    It's used only first time run MIUI launcher app like com.mi.globallayout.
  id: android.miui.home.launcher.res
  removal: caution
- description: |-
    Refers to a specific package within the MIUI overlay,
    The package contains various resources and components that are used to customize the appearance and behavior of the MIUI interface.
    https://source.android.com/docs/core/runtime/rros
  id: android.miui.overlay
  removal: critical
- description: |-
    Config to default icons/placeholder widgets in MIUI launcher.
    It's used only first time run MIUI launcher app like com.mi.globallayout.
  id: android.miui.poco.launcher.res
  removal: caution
- description: |-
    Likely an important overlay for telephony services and com.android.providers.telephony, specific for devices running HyperOS/MIUI. Not safe to delete.
  id: android.miui.overlay.telephony
  removal: critical

